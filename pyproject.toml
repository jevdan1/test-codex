[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-portable"
version = "0.1.0"
description = "Portable crypto data collector and chart viewer"
authors = [{name = "Portable Crypto Team"}]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "httpx>=0.27",
    "pyarrow>=14.0",
    "pandas>=2.1",
    "python-dateutil>=2.8",
    "pydantic>=2.5",
    "yamlpath>=3.6",
    "numpy>=1.26",
    "typing-extensions>=4.9",
    "tenacity>=8.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "mypy>=1.8",
    "ruff>=0.1.7"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crypto_portable*"]
